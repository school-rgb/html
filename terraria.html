<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>game</title>
    <style>
        /* CSS Reset to eliminate all margins, padding, and scrollbars */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }

        /* Full viewport iframe styling */
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

<iframe 
        src="https://school-rgb.github.io/terraria/" 
        title="game"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
    >
        <!-- Fallback note for browsers or websites blocking iframe embedding -->
        <p style="color: #ffffff; font-family: sans-serif; padding: 20px; text-align: center;">
            Your browser or the target website does not support inline frames. 
            <a href="https://school-rgb.github.io/terraria/" target="_blank" style="color: #38bdf8;">game</a>
        </p>
    </iframe>

</body>
</html>
